{% extends 'base.html' %}
{% block content %}
<h2>Statistics</h2>
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Mentor and mentee overview</div>
            <div class="card-body">
                <canvas id="statsChart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>
<script>
const ctx = document.getElementById('statsChart');
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: ['Mentors','Mentees','Meetings'],
    datasets: [{
      label: 'Counts',
      data: [{{ mentors|length }}, {{ mentees|length }}, {{ meetings|length }}],
      backgroundColor: ['#0d6efd','#198754','#ffc107']
    }]
  }
});
</script>
{% endblock %}
