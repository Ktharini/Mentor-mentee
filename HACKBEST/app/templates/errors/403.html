{% extends 'base.html' %}
{% block content %}
<section class="surface-card access-denied">
    <span class="empty-illustration"><i class="bi bi-shield-lock" aria-hidden="true"></i></span>
    <p class="eyebrow">403 · ACCESS RESTRICTED</p>
    <h2>This space isn’t on your path</h2>
    <p>Your role doesn’t have permission to view this page. Head back to your own workspace.</p>
    {% if current_user.is_authenticated %}
    <a class="button button-primary" href="{{ url_for('index') }}">Go to my dashboard</a>
    {% else %}
    <a class="button button-primary" href="{{ url_for('auth.login') }}">Sign in</a>
    {% endif %}
</section>
{% endblock %}
