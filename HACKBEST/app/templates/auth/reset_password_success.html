{% extends 'base.html' %}
{% block content %}
<section class="auth-portal auth-portal-narrow" aria-labelledby="reset-success-title">
    <div class="auth-panel auth-result-panel">
        <span class="auth-result-icon"><i class="bi bi-check2-circle" aria-hidden="true"></i></span>
        <h2 id="reset-success-title">Password updated</h2>
        <p>Your ProGuide password has been changed. Other signed-in sessions have been invalidated.</p>
        <a class="button button-primary auth-submit" href="{{ url_for('auth.login') }}">Back to Login</a>
    </div>
</section>
{% endblock %}
