{% extends 'base.html' %}
{% block content %}
<section class="auth-portal auth-portal-narrow" aria-labelledby="invalid-reset-title">
    <div class="auth-panel auth-result-panel">
        <span class="auth-result-icon auth-result-warning"><i class="bi bi-link-45deg" aria-hidden="true"></i></span>
        <h2 id="invalid-reset-title">This reset link can’t be used</h2>
        <p>This password reset link is invalid, expired, or has already been used. Request a new link to continue.</p>
        <a class="button button-primary auth-submit" href="{{ url_for('auth.forgot_password') }}">Request a new link</a>
    </div>
</section>
{% endblock %}
